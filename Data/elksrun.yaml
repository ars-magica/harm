      for Tim. Tim leaps back and forth with his spell, and finally shapechanges to
      a raven to pick up an arcane connection to the lord himself.
    - Brid learns that some businesses in town are haunted by faeries.
    - THere is another raven, serving the *Mistress of Fate* who is also coming to
      the lord's bedroom, but to warn him.  Tim knocks it out with a spell and takes
      a feather as an arcane connection.
    title: An Arcane Connection from Nenagh
