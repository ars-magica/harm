  season: Spring 1255
  story:
  - SQ: 8
    comment:
    - Trade three Creo tractatus to receive three Imaginem Tractatus (Q2/Q9/Q8), as
      proposed by Rhianna.
    - One confidence point per character taking part.
    - "The covenant lends \xA3165 to Aedan on the same terms as he had with the church."
    narrative:
    - Joseph ex Miscellanea of Lambaird visits with his wife, Rhianna, and his brother
      Jacob, who is a horse trader.  They are fraternal twins. Joseph has been instrumental
      to healing the rift between Vigil and Lambaird.  It is not the first time they
      visit Elk's Run after the agreements of resiprocal reading hospitality were
      made.
    - Aedan MacCloud, an Irish lord, appears with his daughter, Deirdre, who is also
      betrothed to Joseph. It turns out that he has about eight wives, under old Brehon
      Law, often with faerie blessing. Aedan brother, a parish priest known as father
      Clint, is also part of the entourage.  They also bring two guards. Aedan's holdings
      are in the North of Ireland.
    - "Cieran is left mediating between the two groups.  Aedan has been rebaptised\
      \ and borrowed \xA3300 from the church, something which binds him to arrange\
      \ a church marriage for his daughter. The betrothal was sealed before his rebaptism,\
      \ in a faerie ceremony. It seems that the faeries involved are quite powerful.\
      \ Faerie blood also runs in the family, and strongly so with Deirdre."
    - Joseph's polygamy was the idea of his first wife, Criodne, a maga, who had started
      her longevity ritual.  She wanted Joseph to have more children before his longevity
      ritual.
    - Cieran have them see that both parties have been less than honest and entered
      incompatible bargains. In the end, he arranges for Elk's Run to lend Aedan the
      money to cover half his dept to the church, with Joseph to have Vigil cover
      the other half, so that Aedan can embrace the faerie and Brehon ways.
    title: "Joseph's fianc\xE9"
- season: Spring 1256
  story:
  - narrative:
    - Maine and Una, as well as Raymond, have left a few years ago.
    - Crimthann is no longer active, whether he is dead, infirm, or lost in the magic
      realm is not decided.
    - The magi agree to promote the welfare of the common people as a general principle,
      and decide against any uprising against English magi or Norman lords.
    - As a means to support the common people, they will support the building of hospitals,
      and develop a great library on Medicine and Chirurgy.
    - The council supports Cieran's wish to develop a great library on Imaginem, to
      attract paying readers.
    - The matter of Lord Protector is discussed, as it is expected to come up at the
      tribunal.  The magi are concerned about the Norman intrusion on magical and
      faerie lands, and Ashenrise's apparent support. Archie and Tim are appointed
      to speak on the covenants behalf.
    - Sean and Tiou are appointed to barter for vis exchange at the tribunal, aiming
      to stock up the arts where we have no source.
    title: Council Meeting 1256
- season: Summer 1256
  story:
  - SQ: 9
    comment: 1 confidence per session active.
    narrative:
    - Gathering at Communova.  Tadgh the Bard and Aurelia of Mercere are announcing
      news, Aurelia from the covenant and Tadgh from the war in Breifne.
    - Tim meets Savriu of Verditius, visiting from the East. Saveriu knows of the
      hospitalier plans, and offers a spell to erect a fortress.
    - Sean approaches Cormoran the hedge elementalist to inquire about Irish tradition,
      but gets a rather non-infromative answer.  Coromoran encourages him to learn
      from his grandparents, but Sean who was taken into apprenticeship does not remember
      them. He knows that his clan was the O'Sullivan and decides to seek them out.
      Sean invites Cormoran to come to Elk's Run, but Cormoran does not appear thrilled.
    - "Aurelia has books to sell, particularly two titles by father Joseph of Napoli,\
      \ who writes about the Order from the perspective of the Order. Beibhinn buys\
      \ the two books by father Joseph of Napoli, and the covenant buys the *Canon\
      \ of Medicine* (the latter for \xA32). Tim orders books on Etiquette and Seaon\
      \ inquires about illustrated books on area lore."
    - Deirbhile meets Enyerita of Jerbiton at Communova, who offers to craft a staff
      for her in exchange for a season or two of study at Elk's Run.  She does not
      have the wood struck by lightning though. Deirbhile knows of the tree at Circulus
      Ruber, but they not being on friendly terms with Elk's Run, she does not want
      to approach them.  She goes to the Leth Moga camp to look for a broker, and
      talks Briharn, an elderly redcap, who offers to try, but he refuses to hide
      the identity of the client.
    - At the sacred council, Siofra the Wolf Walker, raised the problems of Lord Butler
      encrouching on the magi forest. The faerie ambassador concurred.  Ashenrise
      denies any involvement, although they have trade relations and run caravans
      through his lands.  Vigil and Lambaird, prompted by Beibhinn, speak strongly
      for action to preserve the magical lands.  Praesis opposes, as a matter of non-interference
      with the mundanes.  Others are luke-warm at best.
    - Tiou bargains for spells with Ellaebhinn of West Point. She gets *All the vows
      forgotten* PeMe 20, *Poisoning the Will* PeMe 65, and *Peering into the Mortal
      Mind* InMe 30 [ArM5:149] in exchange for *Communication of the Hero*, *Curse
      of Slumber* ReMe20, and *See the Spirits of the Night* InMe30.
    - Cieran is approached by Guillaume of Praesis, asking him to support brother
      Gerard's fortness outside Cork.  He makes a speech two days later at the tribunal,
      and antagonises all the pro-Irish magi.
    - "Guillaume has had an ongoing rivalry with the maga Gr\xE1inne inghean Uait\xE9\
      ar of the covenant of Vigil since before 1220.  There have been seven Wizard's\
      \ Wars between them, but Guillaume has now eased off the rivalry and turned\
      \ to God.  While he ignores the conflic, Grainne is still angry."
    - During the last night, Tious receives an invitation for a new Cabal, to meet
      at the Brazen Head in Dublin at the Autumn Equinox.
    title: Tribunal 1256
