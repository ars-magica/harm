charID: Eogan mac Eogan
concept:
  appearance: Slender, charming guy with dark hair. The clothes are clean, but smell
    of dog.
  born: 1230
  charData:
    Background: 
      "Born after his fathers death in Winter 1230. Astrið read a death
      prophecy for the newborn Eogan at the fair in 1230.  The covenant has always
      treated him well, in honour of his father. However, he cannot free himself
      from his father's fate and has never been able to trust the magi. His mother
      remarried and he has a couple of half-siblings in the village He has always
      found himself a bit of an outsider, but found refuge at the kennel when Una
      was not there. Seeing his aptitude with dogs, Una's mundane assistants trained
      him."
    Prophecy: "*He shall live like his father; die like his father.*  (Astri\xF0.\
      \ spoken at the Autumn fair 1230)"
    Size: 0
  charGlance: {}
  charType: Companion
  concept: Kennel Master
  name: Eogan mac Eogan
  player: George
  portrait: eogan.jpeg
  quirk: Avoids danger, particularly heights.
